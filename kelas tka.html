<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Kelas TKA</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            overflow-x: hidden;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .login-form, .register-form, .dashboard {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 10px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            animation: fadeIn 1s ease-in-out;
        }
        .login-form, .register-form {
            max-width: 400px;
            margin: 100px auto;
        }
        .dashboard {
            margin-top: 50px;
        }
        h1, h2 {
            text-align: center;
            color: #4a4a4a;
            animation: slideIn 1s ease-out;
        }
        input, button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus {
            outline: none;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.5);
        }
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            cursor: pointer;
            animation: pulse 2s infinite;
        }
        button:hover {
            transform: scale(1.05);
        }
        .switch-link {
            text-align: center;
            margin-top: 10px;
        }
        .switch-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
        }
        .switch-link a:hover {
            text-decoration: underline;
        }
        .structure {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 30px;
        }
        .role {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            width: 200px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .role:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }
        .role input {
            width: 100%;
            margin-top: 10px;
        }
        .courses {
            margin-top: 50px;
            text-align: center;
        }
        .course-list {
            list-style: none;
            padding: 0;
        }
        .course-list li {
            background: #e0e0e0;
            margin: 10px 0;
            padding: 10px;
            border-radius: 5px;
            animation: fadeInUp 0.5s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideIn {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Halaman Login -->
        <div id="login" class="login-form">
            <h1>Login Kelas TKA</h1>
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button onclick="login()">Masuk</button>
            <div class="switch-link">
                <a href="#" onclick="showRegister()">Belum punya akun? Buat Akun</a>
            </div>
        </div>

        <!-- Halaman Register -->
        <div id="register" class="register-form">
            <h1>Buat Akun Kelas TKA</h1>
            <input type="text" id="reg-username" placeholder="Username" required>
            <input type="password" id="reg-password" placeholder="Password" required>
            <button onclick="register()">Daftar</button>
            <div class="switch-link">
                <a href="#" onclick="showLogin()">Sudah punya akun? Masuk</a>
            </div>
        </div>

        <!-- Dashboard Setelah Login -->
        <div id="dashboard" class="dashboard">
            <h2>Struktur Kelas TKA</h2>
            <div class="structure">
                <div class="role">
                    <h3>PA (Pembimbing Akademik)</h3>
                    <input type="text" id="pa" placeholder="Nama PA">
                </div>
                <div class="role">
                    <h3>Korti (Ketua Kelas)</h3>
                    <input type="text" id="korti" placeholder="Nama Korti">
                </div>
                <div class="role">
                    <h3>Wakil Korti</h3>
                    <input type="text" id="wakil-korti" placeholder="Nama Wakil Korti">
                </div>
                <div class="role">
                    <h3>Bendahara</h3>
                    <input type="text" id="bendahara" placeholder="Nama Bendahara">
                </div>
                <div class="role">
                    <h3>Sekretaris</h3>
                    <input type="text" id="sekretaris" placeholder="Nama Sekretaris">
                </div>
            </div>
            <button onclick="saveStructure()">Simpan Struktur</button>

            <div class="courses">
                <h2>Mata Kuliah</h2>
                <input type="text" id="new-course" placeholder="Tambah Mata Kuliah Baru">
                <button onclick="addCourse()">Tambah</button>
                <ul id="course-list" class="course-list"></ul>
            </div>
        </div>
    </div>

    <script>
        // Fungsi untuk menampilkan halaman login
        function showLogin() {
            document.getElementById('register').style.display = 'none';
            document.getElementById('login').style.display = 'block';
        }

        // Fungsi untuk menampilkan halaman register
        function showRegister() {
            document.getElementById('login').style.display = 'none';
            document.getElementById('register').style.display = 'block';
        }

        // Fungsi Register (Simpan ke localStorage)
        function register() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            if (username && password) {
                // Cek apakah username sudah ada
                if (localStorage.getItem(username)) {
                    alert('Username sudah digunakan!');
                } else {
                    localStorage.setItem(username, password);
                    alert('Akun berhasil dibuat! Silakan login.');
                    showLogin();
                }
            } else {
                alert('Harap isi semua field!');
            }
        }

        // Fungsi Login (Cek dari localStorage)
        function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const storedPassword = localStorage.getItem(username);
            if (storedPassword && storedPassword === password) {
                document.getElementById('login').style.display = 'none';
                document.getElementById('register').style.display = 'none';
                document.getElementById('dashboard').style.display = 'block';
            } else {
                alert('Username atau Password salah!');
            }
        }

        // Fungsi Simpan Struktur (Dummy, hanya alert)
        function saveStructure() {
            const pa = document.getElementById('pa').value;
            const korti = document.getElementById('korti').value;
            const wakilKorti = document.getElementById('wakil-korti').value;
            const bendahara = document.getElementById('bendahara').value;
            const sekretaris = document.getElementById('sekretaris').value;
            alert(`Struktur disimpan:\nPA: ${pa}\nKorti: ${korti}\nWakil Korti: ${wakilKorti}\nBendahara: ${bendahara}\nSekretaris: ${sekretaris}`);
        }

        // Fungsi Tambah Mata Kuliah
        function addCourse() {
            const newCourse = document.getElementById('new-course').value;
            if (newCourse) {
                const li = document.createElement('li');
                li.textContent = newCourse;
                document.getElementById('course-list').appendChild(li);
                document.getElementById('new-course').value = '';
            } else {
                alert('Masukkan nama mata kuliah!');
            }
        }

        // Tampilkan login secara default
        showLogin();
    </script>
</body>
</html>
